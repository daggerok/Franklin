name: Update Franklin ETF data

on:
  # Weekly refresh (every Sunday at 00:00 UTC) plus manual runs. Merges to
  # main/arena branches no longer trigger a live data refresh on their own.
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      max_fetches:
        description: "Batch size; continue after the saved ticker cursor; empty or 0 means a full pass over every fund"
        required: false
        default: ""
        type: string
      request_sleep:
        description: "Seconds between outgoing request starts (franklintempleton.com and Yahoo throttle; SEC allows 10/s; keep >= 1)"
        required: false
        default: ""
        type: string
      aum:
        description: "AUM min:max; bounds may be amounts or K/M/B/T suffixes, or nano/micro/small/mid/large preset"
        required: false
        default: ""
        type: string
      ter:
        description: "Expense ratio range in %: min:max, min:, :max, or :"
        required: false
        default: ""
        type: string
      concurrency:
        description: "Parallel fund update workers (keep low)"
        required: false
        default: ""
        type: string
      holdings_page_size:
        description: "Rows in each generated current-holdings JSON page"
        required: false
        default: ""
        type: string
      history_page_size:
        description: "Rows in each generated price-history JSON page"
        required: false
        default: ""
        type: string
      store_raw_downloads:
        description: "Store the source pages under api/franklin/raw (true/yes/on/1)"
        required: false
        default: ""
        type: string
      max_retries:
        description: "Retries after the initial request (default 2)"
        required: false
        default: ""
        type: string
      tickers:
        description: "Only update these tickers, separated by spaces or commas"
        required: false
        default: ""
        type: string
      dividend_yield:
        description: "Dividend-yield percentage range; colon required"
        required: false
        default: ""
        type: string
      sec_yield:
        description: "SEC yield percentage range; colon required"
        required: false
        default: ""
        type: string
      history_range:
        description: "Yahoo chart range for history rows (max, 10y, 5y, ...)"
        required: false
        default: ""
        type: string
      edgar_fallback:
        description: "SEC EDGAR Form N-PORT-P fallback for holdings (default on)"
        required: false
        default: ""
        type: string
      skip_yahoo:
        description: "Update franklintempleton.com data only, keeping previous history (true/1)"
        required: false
        default: ""
        type: string
      skip_franklin:
        description: "Update history only (Yahoo), keeping the previously published catalog and holdings (true/1)"
        required: false
        default: ""
        type: string
      category:
        description: "Keep only this provider category substring"
        required: false
        default: ""
        type: string
      performance_ytd:
        description: "Annualized YTD return range: min:max"
        required: false
        default: ""
        type: string
      performance_1y:
        description: "Annualized 1Y return range"
        required: false
        default: ""
        type: string
      performance_3y:
        description: "Annualized 3Y return range"
        required: false
        default: ""
        type: string
      performance_5y:
        description: "Annualized 5Y return range"
        required: false
        default: ""
        type: string
      total_return_ytd:
        description: "Cumulative YTD return range"
        required: false
        default: ""
        type: string
      total_return_1y:
        description: "Cumulative 1Y return range"
        required: false
        default: ""
        type: string
      total_return_3y:
        description: "Cumulative 3Y return range"
        required: false
        default: ""
        type: string
      total_return_5y:
        description: "Cumulative 5Y return range"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      NODE_USE_SYSTEM_CA: '1'
      MAX_FETCHES: ${{ inputs.max_fetches || '' }}
      REQUEST_SLEEP: ${{ inputs.request_sleep || '' }}
      AUM: ${{ inputs.aum || '' }}
      TER: ${{ inputs.ter || '' }}
      CONCURRENCY: ${{ inputs.concurrency || '' }}
      HOLDINGS_PAGE_SIZE: ${{ inputs.holdings_page_size || '' }}
      HISTORY_PAGE_SIZE: ${{ inputs.history_page_size || '' }}
      STORE_RAW_DOWNLOADS: ${{ inputs.store_raw_downloads || '' }}
      MAX_RETRIES: ${{ inputs.max_retries || '' }}
      TICKERS: ${{ inputs.tickers || '' }}
      DIVIDEND_YIELD: ${{ inputs.dividend_yield || '' }}
      SEC_YIELD: ${{ inputs.sec_yield || '' }}
      HISTORY_RANGE: ${{ inputs.history_range || '' }}
      EDGAR_FALLBACK: ${{ inputs.edgar_fallback || '' }}
      SKIP_YAHOO: ${{ inputs.skip_yahoo || '' }}
      SKIP_FRANKLIN: ${{ inputs.skip_franklin || '' }}
      CATEGORY: ${{ inputs.category || '' }}
      PERFORMANCE_YTD: ${{ inputs.performance_ytd || '' }}
      PERFORMANCE_1Y: ${{ inputs.performance_1y || '' }}
      PERFORMANCE_3Y: ${{ inputs.performance_3y || '' }}
      PERFORMANCE_5Y: ${{ inputs.performance_5y || '' }}
      TOTAL_RETURN_YTD: ${{ inputs.total_return_ytd || '' }}
      TOTAL_RETURN_1Y: ${{ inputs.total_return_1y || '' }}
      TOTAL_RETURN_3Y: ${{ inputs.total_return_3y || '' }}
      TOTAL_RETURN_5Y: ${{ inputs.total_return_5y || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install type definitions
        run: bun install --frozen-lockfile

      - name: Validate inline browser script
        run: bun --use-system-ca ./scripts/check-index.ts

      - name: Run updater unit tests
        run: bun --use-system-ca test scripts/update-data.test.ts

      - name: Generate api/franklin static data
        run: bun --use-system-ca ./scripts/update-data.ts

      - name: Commit updated data
        run: |
          if git diff --quiet -- api/franklin; then
            echo "api/franklin is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/franklin
          git commit -m "Update Franklin ETF data"
          git push
